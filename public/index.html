<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6F5C">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>DevisFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone-width app shell, centered on desktop; masking-tape yellow marks what the AI did */
:root {
  --bg: #EEF1F2;
  --surface: #FFFFFF;
  --surface-2: #F5F7F8;
  --ink: #18252E;
  --muted: #5B6B75;
  --line: #D9E0E3;
  --accent: #1F6F5C;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE9;
  --tape: #F1C84B;
  --tape-soft: #FBF1CF;
  --tape-ink: #4A3A06;
  --warn: #B4531C;
  --warn-soft: #FBE7DA;
  --ok: #2E7D4F;
  --ok-soft: #DDF1E4;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1619; --surface: #172227; --surface-2: #1D2A30; --ink: #E6EDF0; --muted: #98A9B2;
    --line: #2B3A41; --accent: #5BC2A4; --accent-ink: #0B1A15; --accent-soft: #173A31;
    --tape: #E9C04A; --tape-soft: #3A3218; --tape-ink: #F5E3A6; --warn: #F09A63; --warn-soft: #3D2417;
    --ok: #6BCB92; --ok-soft: #173326; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1619; --surface: #172227; --surface-2: #1D2A30; --ink: #E6EDF0; --muted: #98A9B2;
  --line: #2B3A41; --accent: #5BC2A4; --accent-ink: #0B1A15; --accent-soft: #173A31;
  --tape: #E9C04A; --tape-soft: #3A3218; --tape-ink: #F5E3A6; --warn: #F09A63; --warn-soft: #3D2417;
  --ok: #6BCB92; --ok-soft: #173326; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
.shell { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.demo-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  font-size: 12px; color: var(--muted);
}
.tape-label {
  background: var(--tape); color: #2B2104; font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
  text-transform: uppercase; padding: 3px 10px; transform: rotate(-1.2deg); display: inline-block;
}
.switch { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.switch button {
  border: 0; background: transparent; color: var(--muted); font: 600 13px var(--body); padding: 6px 12px; border-radius: 999px; cursor: pointer;
}
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.app { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; min-height: 640px; }
.app-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.who { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.3; }
.view { flex: 1; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
h2 { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h3 { font-family: var(--display); font-weight: 700; font-size: 15px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); }
.tabs button {
  border: 0; background: transparent; color: var(--muted); font: 600 12px var(--body); padding: 10px 4px 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;
}
.tabs button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs .dot { position: absolute; top: 6px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.item { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: inherit; font: inherit; width: 100%; }
.item:last-child { border-bottom: 0; }
.item-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.item-title { font-weight: 600; }
.item-meta { font-size: 12px; color: var(--muted); }
.chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.new { background: var(--accent-soft); color: var(--accent); }
.chip.visit { background: var(--tape-soft); color: var(--tape-ink); }
.chip.sent { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }

.ai { background: var(--tape-soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.ai-tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--tape-ink); }
.ai ul { margin: 0; padding-left: 18px; }
.warnbox { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.warnbox b { color: var(--warn); }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.photo { aspect-ratio: 4/3; border-radius: 8px; max-width: 100%; position: relative; overflow: hidden; }
.photo span { position: absolute; left: 6px; bottom: 4px; font-size: 10px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }

.btn { border: 0; border-radius: 12px; padding: 13px 16px; font: 600 15px var(--body); cursor: pointer; width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.back { background: none; border: 0; color: var(--accent); font: 600 14px var(--body); padding: 0; cursor: pointer; align-self: flex-start; }

/* Visit / dictation */
.mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; }
.mic { width: 88px; height: 88px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; }
.mic svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 2; }
.mic.rec { background: var(--warn); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 12px var(--warn-soft); } }
.timer { font-family: var(--mono); font-size: 20px; }
.wave { display: flex; gap: 3px; height: 28px; align-items: center; }
.wave i { width: 4px; border-radius: 2px; background: var(--warn); animation: wv .9s ease-in-out infinite; }
@keyframes wv { 0%,100% { height: 6px; } 50% { height: 26px; } }
.transcript { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-style: italic; min-height: 60px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.measure td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.measure td:last-child { text-align: right; font-family: var(--mono); white-space: nowrap; padding-left: 8px; }
.src { font-size: 11px; color: var(--muted); display: block; }
.confirm { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.confirm button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: 600 13px var(--body); cursor: pointer; }
.confirm button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Quote document */
.doc { background: #FFFFFF; color: #18252E; border: 1px solid var(--line); border-radius: 6px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; font-size: 12.5px; }
.doc-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.doc-co { font-family: var(--display); font-weight: 800; font-size: 15px; color: #1F6F5C; }
.doc-small { color: #5B6B75; font-size: 11.5px; line-height: 1.4; }
.doc-title { font-family: var(--display); font-weight: 700; font-size: 17px; }
.doc-lines { overflow-x: auto; }
.doc-lines table { min-width: 280px; }
.unitp { display: block; font-size: 11px; color: #5B6B75; font-family: var(--mono); }
.doc-lines th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: #5B6B75; border-bottom: 1.5px solid #18252E; padding: 4px 4px 4px 0; font-weight: 600; }
.doc-lines td { padding: 7px 4px 7px 0; border-bottom: 1px solid #E3E8EA; vertical-align: top; }
.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.doc-lines input { width: 52px; font: 500 12.5px var(--mono); text-align: right; border: 1px solid #C9D3D7; border-radius: 4px; padding: 3px 4px; background: #FFFBEA; color: #18252E; }
.totals { margin-left: auto; width: 100%; max-width: 240px; }
.totals td { padding: 3px 0; }
.totals tr.grand td { border-top: 1.5px solid #18252E; font-weight: 700; font-size: 14px; padding-top: 6px; }
.hint { font-size: 12px; color: var(--muted); }

/* Follow-up */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 8px 6px; text-align: center; }
.kpi b { display: block; font-family: var(--display); font-size: 20px; }
.kpi span { font-size: 10.5px; color: var(--muted); }
.msg { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; white-space: pre-line; }

/* Client chat */
.chat { display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 85%; padding: 9px 12px; border-radius: 14px; font-size: 14px; }
.bubble.bot { background: var(--surface-2); border-bottom-left-radius: 4px; align-self: flex-start; }
.bubble.me { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; align-self: flex-end; }
.bubble.flag { background: var(--tape-soft); }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices button { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px; padding: 7px 12px; font: 600 13px var(--body); cursor: pointer; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { .mic.rec, .wave i { animation: none; } }

/* v2 additions */
.draft-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; background: var(--accent-soft); color: var(--ink); border: 0; border-radius: 12px; padding: 10px 14px; font: 400 13px var(--body); cursor: pointer; }
.draft-bar b { font-family: var(--display); font-size: 14px; }
.draft-bar > span:last-child { color: var(--accent); font-weight: 600; }
.acts { align-self: stretch; font-size: 12.5px; color: var(--muted); padding: 2px 4px; }
.acts summary { cursor: pointer; list-style: none; color: var(--accent); font-weight: 600; }
.acts summary::-webkit-details-marker { display: none; }
.acts summary::after { content: " ›"; }
.acts[open] summary::after { content: " ⌄"; }
.acts > div { font-family: var(--mono); font-size: 11.5px; padding: 2px 0 2px 14px; }
.acts.one { color: var(--accent); font-weight: 600; }
.blabel { display: block; font-size: 11px; font-weight: 700; opacity: .8; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
.act { align-self: center; font-family: var(--mono); font-size: 11.5px; color: var(--tape-ink); background: var(--tape-soft); padding: 3px 10px; border-radius: 6px; max-width: 95%; }
.sugg { display: flex; flex-direction: column; gap: 6px; }
.sugg button { text-align: left; border: 1px dashed var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: 400 13.5px var(--body); cursor: pointer; }
.composer { position: sticky; bottom: 0; background: var(--surface); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); }
.composer textarea { min-height: 52px; }
.bubble { white-space: pre-line; }
.link { border: 0; background: none; color: var(--accent); font: 600 13px var(--body); cursor: pointer; padding: 0; text-decoration: underline; }
.entry { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.entry-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; font: 400 12px var(--body); min-width: 0; }
.entry-btn svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
.entry-btn b { font-family: var(--display); font-size: 14px; }
.entry-btn span { color: var(--muted); }
.qr { justify-content: flex-start; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.head-right { display: flex; align-items: center; gap: 10px; }
.room { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.room-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.room-name { font-family: var(--display); font-weight: 700; font-size: 16px; border: 0; background: transparent; color: var(--ink); padding: 0; width: 100%; min-width: 0; }
textarea, .field, select { width: 100%; font: 400 14.5px var(--body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
.room-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 600 13.5px var(--body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.pill-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.pill-btn.listening { background: var(--warn); border-color: var(--warn); color: #fff; }
.pill-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.partial { font-size: 13px; color: var(--muted); font-style: italic; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.thumbs img, .thumbs .photo { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; }
.file-in { position: absolute; width: 1px; height: 1px; opacity: 0; }
.line { border-bottom: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 6px; }
.line-row { display: grid; grid-template-columns: 64px auto 74px 1fr; gap: 6px; align-items: center; font-size: 13px; }
.line-row > span:nth-child(2) { white-space: nowrap; color: var(--muted); }
.line-top { display: flex; gap: 6px; align-items: flex-start; }
.line-top .lbl { min-height: 0; resize: none; overflow: hidden; line-height: 1.35; font-family: var(--body); }
.sum [hidden] { display: none; }
.dsub .none { font: 400 13px var(--body); color: var(--muted); }
.line-row .line-total { text-align: right; font: 600 13.5px var(--mono); }
.line .acts { display: flex; gap: 0; flex: none; }
.line .acts button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 4px 5px; }
.line-row input { width: 100%; min-width: 0; font: 500 13.5px var(--mono); text-align: right; padding: 6px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); }
.line .lbl { font: 500 14px var(--body); background: transparent; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; padding: 2px 0; color: var(--ink); width: 100%; }
.line-total { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; min-width: 72px; }
.del { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
.flag { font-size: 11.5px; color: var(--warn); font-weight: 600; }
.room-h { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.sum { display: flex; flex-direction: column; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.sum div { display: flex; justify-content: space-between; gap: 8px; }
.sum .grand { font-weight: 700; font-size: 16px; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
.sum span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cat-row { display: grid; grid-template-columns: 1fr 70px 84px auto; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.cat-row input, .cat-row select { padding: 7px 8px; font-size: 13.5px; min-width: 0; }
.cat-row input.price { font-family: var(--mono); text-align: right; }
label.lab { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (max-width: 360px) { .line-row { grid-template-columns: 56px auto 64px 1fr; } }
/* v5 */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 600 12.5px var(--body); padding: 8px 2px; border-radius: 9px; cursor: pointer; position: relative; }
.seg button[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg .badge { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--warn); color: #fff; font-size: 10px; margin-left: 3px; }
.dhead { display: flex; flex-direction: column; gap: 6px; }
.dhead-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.dmeta { font-size: 12.5px; color: var(--muted); }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); cursor: pointer; text-align: left; color: var(--ink); font: inherit; width: 100%; }
.card:hover { border-color: var(--accent); }
.card-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card-title { font-family: var(--display); font-weight: 700; font-size: 15px; }
.card-sub { font-size: 13px; color: var(--muted); }
.card-foot { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 12.5px; }
.next { color: var(--accent); font-weight: 600; }
.next.warn { color: var(--warn); }
.amount { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.filters button { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 600 12.5px var(--body); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.todo { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: inherit; font: inherit; }
.todo:last-child { border-bottom: 0; }
.todo .dotc { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.todo-t { flex: 1; min-width: 0; }

- N'affiche jamais d'identifiant technique (dossier_id, line_id, item_id, message_id) dans tes réponses.

function actsHtml(list) {
  const items = list.filter(x => !/^⚠ À vérifier/.test(x));
  if (!items.length) return "";
  const add = items.filter(x => x.startsWith("+ ")).length, chg = items.filter(x => x.startsWith("✎")).length, del = items.filter(x => x.startsWith("−")).length;
  const other = items.filter(x => !/^(\+ |✎|−|↕|Dossier mis à jour)/.test(x));
  const parts = [...other.map(x => x.replace(/ \(.*\)$/, "")), add && `${add} ligne${add > 1 ? "s" : ""} ajoutée${add > 1 ? "s" : ""}`, chg && `${chg} modifiée${chg > 1 ? "s" : ""}`, del && `${del} retirée${del > 1 ? "s" : ""}`].filter(Boolean);
  if (!parts.length) parts.push("Dossier mis à jour");
  const detail = items.filter(x => /^(\+ |✎|−|↕)/.test(x));
  return detail.length ? `<details class="acts"><summary>✓ ${esc(parts.join(" · "))}</summary>${detail.map(x => `<div>${esc(x)}</div>`).join("")}</details>` : `<div class="acts one">✓ ${esc(parts.join(" · "))}</div>`;
}

  set(9, "normal", mute); doc.text(ferme ? "Prix forfaitaire ferme" : "Devis estimatif", L, y + 6.5 + tl.length * 5);
  doc.text(`Valable jusqu'au ${validUntil}`, L, y + 11 + tl.length * 5);
  y += 30;
  // Tableau
  const cols = { q: 128, u: 132, p: 160, m: R };
  const header = () => {
    doc.setFillColor(...(cl ? [235, 235, 235] : tint)); doc.rect(L, y - 5, W, 8, "F");
    set(8, "bold", cl ? ink : acc);
    doc.text("PRESTATION", L + 2, y); doc.text("QTÉ", cols.q, y, { align: "right" }); doc.text("UNITÉ", cols.u, y);
    doc.text("PRIX UNIT.", cols.p, y, { align: "right" }); doc.text("MONTANT", cols.m - 2, y, { align: "right" }); y += 8;
  };
  const room = (r) => d.quote.lines.filter(l => l.room === r).reduce((a, l) => a + num(l.qty) * num(l.price), 0);
  header();
  [...new Set(d.quote.lines.map(l => l.room))].forEach(r => {
    if (y > 250) { doc.addPage(); y = 22; header(); }
    set(9.5, "bold"); doc.text(r, L + 2, y); set(8.5, "normal", mute); doc.text(chf(room(r)), cols.m - 2, y, { align: "right" }); y += 2;
    doc.setDrawColor(210); doc.setLineWidth(0.2); doc.line(L, y, R, y); y += 5;
    d.quote.lines.filter(l => l.room === r).forEach(l => {
      const w = doc.splitTextToSize(l.label, 96);
      if (y + w.length * 4.5 > 262) { doc.addPage(); y = 22; header(); }
      set(9.5, "normal"); doc.text(w, L + 4, y);
      doc.text(l.qty === "" ? "?" : String(l.qty).replace(".", ","), cols.q, y, { align: "right" }); doc.text(l.unit, cols.u, y);
      doc.text(chf(num(l.price)), cols.p, y, { align: "right" }); doc.text(chf(num(l.qty) * num(l.price)), cols.m - 2, y, { align: "right" });
      y += w.length * 4.5 + 2.5;
    });
    y += 3;
  });
  // Totaux
  if (y > 222) { doc.addPage(); y = 22; }
  y += 2; const tx = 122;
  const row = (a, b, bold) => { set(9.5, bold ? "bold" : "normal"); doc.text(a, tx, y); doc.text(b, R - 2, y, { align: "right" }); y += 5.5; };
  row("Sous-total", chf(t.sub));
  if (t.disc) { row(`Remise ${num(d.quote.discount)} %`, "-" + chf(t.disc)); row("Total hors TVA", chf(t.net)); }
  if (S.vat.liable) row(`TVA ${String(S.vat.rate).replace(".", ",")} %`, chf(t.tva)); else row("Non assujetti à la TVA", "–");
  if (Math.abs(t.rnd) >= 0.005) row("Arrondi", chf(t.rnd));
  y += 1; doc.setFillColor(...(cl ? [30, 30, 30] : acc)); doc.roundedRect(tx - 3, y - 5, R - tx + 3, 9, 1.5, 1.5, "F");
  set(11, "bold", [255, 255, 255]); doc.text("TOTAL CHF", tx, y + 1); doc.text(chf(t.tot), R - 2, y + 1, { align: "right" }); y += 16;
  // Conditions
  if (y > 235) { doc.addPage(); y = 22; }
  set(7.5, "bold", mute); doc.text("CONDITIONS", L, y); y += 5;
  set(9, "normal");
  const cond = [ferme ? "Prix forfaitaire ferme." : "Devis estimatif : le montant final dépend des quantités réellement exécutées.", `Offre valable ${vd} jours, jusqu'au ${validUntil}.`, S.defaults.payment, qopt(d, "notes")].filter(x => String(x || "").trim());
  cond.forEach(x => { const w = doc.splitTextToSize("• " + x, W); doc.text(w, L, y); y += w.length * 4.5 + 1; });
  // Signatures
  y += 12; if (y > 262) { doc.addPage(); y = 40; }
  set(8.5, "normal", mute); doc.text(`Pour ${c.name || "l'entreprise"}`, L, y); doc.text("Bon pour accord, date et signature du client", 112, y);
  doc.setDrawColor(150); doc.setLineWidth(0.2); doc.line(L, y + 14, L + 68, y + 14); doc.line(112, y + 14, R, y + 14);
  // Pied de page sur chaque page
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setDrawColor(220); doc.setLineWidth(0.2); doc.line(L, 282, R, 282);
    set(7.5, "normal", mute);
    doc.text([c.name, c.address, c.phone, c.email].filter(Boolean).join(" · "), L, 286, { maxWidth: W - 22 });
    if (c.iban || c.ide) doc.text([c.iban ? `IBAN ${c.iban}` : "", c.ide ? `IDE ${c.ide}` : ""].filter(Boolean).join(" · "), L, 290);
    doc.text(`Page ${i} / ${pages}`, R, 286, { align: "right" });
  }
  return doc;
}
// L'aperçu affiche le vrai PDF (mêmes pages que le fichier téléchargé).
let pdfViewJob = 0;
async function showPdfPreview(d) {
  const box = document.getElementById("pdf-view"); if (!box) return;
  const job = ++pdfViewJob;
  try {
    if (!window.jspdf) throw new Error("jspdf");
    const data = buildPdf(d).output("arraybuffer");
    await loadPdfjs();
    const pdf = await pdfjsLib.getDocument({ data }).promise, imgs = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i), vp = page.getViewport({ scale: 2 }), c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height; await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      imgs.push(c.toDataURL("image/png"));
    }
    if (job !== pdfViewJob || !document.body.contains(box)) return;
    box.innerHTML = imgs.map((u, i) => `<img class="pdf-page" src="${u}" alt="Page ${i + 1} du devis">`).join("");
  } catch (e) {
    if (job === pdfViewJob && document.body.contains(box)) box.innerHTML = docHtml(d);
  }
}
async function makePdf(d) {
  if (!window.jspdf) { toast("Le générateur PDF n'a pas pu se charger."); return; }
  const doc = buildPdf(d);
  try { await downloads.save({ filename: `devis-${qno(d)}.pdf`, data: doc.output("blob") }); toast("PDF enregistré"); }
  catch (e) { if (e && e.code !== "declined") toast("Le PDF n'a pas pu être enregistré ici."); }
}

// pdf.js (copie locale) est chargé seulement quand on en a besoin : import d'un PDF ou aperçu du devis.
async function loadPdfjs() {
  if (!window.pdfjsLib) await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "/vendor/pdf.min.js"; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
  pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdf.worker.min.js";
}
async function pdfPages(file, max = 3) {
  await loadPdfjs();
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise, out = [];
  for (let i = 1; i <= Math.min(max, pdf.numPages); i++) {
    const page = await pdf.getPage(i), vp = page.getViewport({ scale: 2 }), c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height; await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise; out.push(c.toDataURL("image/jpeg", 0.85));
  }
  return out;
}

// Vérifications faites par le logiciel (pas par l'IA) avant l'envoi.
function checkQuote(d) {
  const w = [], lines = d.quote.lines, cat = S.catalogue;
  const stop = new Set(["de", "des", "la", "le", "les", "du", "et", "au", "aux", "en", "un", "une"]);
  const words = (t) => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9]+/).filter(x => x.length > 1 && !stop.has(x));
  const sum = (pred) => lines.filter(pred).reduce((a, l) => a + num(l.qty), 0);
  lines.forEach(l => {
    if (l.qty === "" || l.qty === null || l.qty === undefined) w.push(`Quantité manquante : ${l.label} (${l.room})`);
    else if (num(l.qty) <= 0) w.push(`Quantité à zéro : ${l.label} (${l.room})`);
    if (!num(l.price)) w.push(`Prix manquant : ${l.label} (${l.room})`);
    const lim = { "m²": 800, "m": 500, "pce": 100, "h": 120 }[l.unit];
    if (lim && num(l.qty) > lim) w.push(`Quantité inhabituelle : ${l.qty} ${l.unit} de ${l.label}`);
  });
  const seen = {};
  lines.forEach(l => { const k = l.room + "|" + l.label; if (seen[k]) w.push(`En double dans « ${l.room} » : ${l.label}`); seen[k] = 1; });
  cat.forEach(c => {

    const groups = {}; tests.forEach(t => (groups[JSON.stringify(t.catalogue)] = groups[JSON.stringify(t.catalogue)] || []).push(t));
    for (const group of Object.values(groups)) {
      S = Object.assign(clone(realS), { catalogue: clone(group[0].catalogue), aiNotes: "", tests: [] });
      if (group[0].trade) { const tr = TRADES[group[0].trade]; S.company.trade = tr.name; S.partLabel = tr.part; S.company.name = "Entreprise test " + tr.name; }

        }
      };

      for (const t of solo) {
        const realD = D, realN = N, d = testDossier(t), t0 = performance.now(); let reply;
        D = [d]; N = []; ui.target = null; S = t.aiNotes ? Object.assign(clone(base), { aiNotes: t.aiNotes }) : base;
        try { reply = await runAgent([{ role: "user", content: t.input }], null, true, []);
          const target = dossier(ui.target) || d;
          ui.evalResults[t.id] = gradeTest(t, target, reply, Math.round(performance.now() - t0), { dossierCount: D.length, sameTarget: target === d });
        } finally { D = realD; N = realN; ui.target = null; S = base; }

    if (saveT) { clearTimeout(saveT); await pushSave(); }
    location.reload();
  } catch (e) {}
}, 20000);
</script>
